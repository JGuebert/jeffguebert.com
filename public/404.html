<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Jeff Guebert</title>
  <meta name="robots" content="noindex">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png"     href="/assets/favicon-32.png" sizes="32x32">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/style.css">

  <!-- Apply stored theme before first paint to prevent flash -->
  <script src="/theme.js"></script>
</head>
<body>

  <!-- ── Theme toggle ──────────────────────────────────────────────── -->
  <button id="theme-toggle" aria-label="Switch to light mode">
    <!-- Moon: visible in dark mode (click to go light) -->
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17"
         viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <!-- Sun: visible in light mode (click to go dark) -->
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="17" height="17"
         viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1"  x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1"  y1="12" x2="3"  y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>
      <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
    </svg>
  </button>

  <main>
    <header>
      <h1>Page not found</h1>
      <p class="tagline">There&rsquo;s nothing at this address.</p>
      <a href="/" class="home-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Homepage
      </a>
    </header>
  </main>

  <!-- ── Footer ──────────────────────────────────────────────────────── -->
  <footer>
    <p>&copy; <span id="year"></span> Jeff Guebert</p>
  </footer>

  <!-- ── JS: theme toggle + year ─────────────────────────────────────── -->
  <script src="/site.js"></script>

</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="165 165 230 230" role="img" aria-label="JG" color="#111">
  <title>JG</title>
  <!-- The homepage references #jg via <use>, so the mark inherits the page's text colour -->
  <g id="jg" fill="none" stroke="currentColor" stroke-width="40" stroke-linejoin="round">
    <path d="M200 200V360" stroke-linecap="butt"/>
    <path d="M200 360h160" stroke-linecap="round"/>
    <path d="M360 360l-100-100" stroke-linecap="round"/>
    <circle cx="200" cy="360" r="20" fill="currentColor" stroke="none"/>
  </g>
</svg>
